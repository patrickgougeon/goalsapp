spring.application.name=metas-api
server.port=${SERVER_PORT:8080}

# Banco de dados (valores padrão compatíveis com o docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/metas}
spring.datasource.username=${DB_USERNAME:metas}
spring.datasource.password=${DB_PASSWORD:metas}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.jackson.time-zone=America/Sao_Paulo

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
