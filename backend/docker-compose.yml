services:
  db:
    image: postgres:17-alpine
    container_name: metas-db
    environment:
      POSTGRES_DB: metas
      POSTGRES_USER: metas
      POSTGRES_PASSWORD: metas
    ports:
      - "5432:5432"
    volumes:
      - metas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metas -d metas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: metas-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/metas
      DB_USERNAME: metas
      DB_PASSWORD: metas
    ports:
      - "8080:8080"

volumes:
  metas-data:
